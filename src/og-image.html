<!DOCTYPE html>
<!-- Source for /og-image.png (1200x630). Regenerate with: python3 build.py --og -->
<html lang="en-IE">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        background: #F3F0EB;
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        position: relative;
    }
    body::before {
        content: '';
        position: absolute;
        inset: 36px;
        border: 1px solid #E2DEDA;
    }
    .label {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #3A6B6B;
        margin-bottom: 28px;
    }
    .name {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 400;
        font-size: 96px;
        line-height: 1.02;
        color: #1A1A1A;
        margin-bottom: 30px;
    }
    .tagline {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 48px;
        color: #3A6B6B;
    }
    .rule { width: 72px; height: 2px; background: #3A6B6B; margin-bottom: 32px; }
    .place {
        position: absolute;
        right: 96px;
        bottom: 76px;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #686460;
    }
</style>
</head>
<body>
    <p class="label">Career and Leadership Coach</p>
    <p class="name">Matt Rutherford Coaching</p>
    <div class="rule"></div>
    <p class="tagline">Make your next move with clarity.</p>
    <p class="place">Dublin, Ireland</p>
</body>
</html>
