<!DOCTYPE html>
<html lang="en-IE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.meta.title }}</title>
    <meta name="description" content="{{ page.meta.description }}">
    <meta name="robots" content="{{ page.robots }}">
    <link rel="canonical" href="{{ page.canonical }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <meta property="og:type" content="{{ page.ogType }}">
    <meta property="og:site_name" content="Matt Rutherford Coaching">
    <meta property="og:title" content="{{ page.meta.ogTitle }}">
    <meta property="og:description" content="{{ page.meta.description }}">
    <meta property="og:url" content="{{ page.canonical }}">
    <meta property="og:image" content="{{ page.ogImage }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ page.meta.ogImageAlt }}">
    <meta property="og:locale" content="en_IE">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.meta.ogTitle }}">
    <meta name="twitter:description" content="{{ page.meta.description }}">
    <meta name="twitter:image" content="{{ page.ogImage }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v={{ assetVersion }}">{{ page_css }}
    <script defer src="https://analytics.stff.me/script.js" data-website-id="{{ analytics.websiteId }}" data-domains="{{ analytics.domains }}"></script>
    {{ jsonld }}
</head>
<body class="{{ page.bodyClass }}">
    <a class="skip-link" href="#main">Skip to content</a>
{{> nav }}
    <main id="main">
{{ content }}
    </main>
{{> footer }}
    <script src="/site.js?v={{ assetVersion }}" defer></script>{{ page_js }}
</body>
</html>
